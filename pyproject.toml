[project]
name = "grocy-mcp-server"
version = "0.1.0"
description = "Serveur MCP avec OAuth 2.1 pour Grocy : consulter et modifier son stock depuis Claude et ChatGPT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "httpx2==2.13.1",
    "cryptography==50.0.2",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E731"]
